name: BetterStructures
version: '2.7.12'
main: com.magmaguy.betterstructures.BetterStructures
api-version: '1.21.4'
folia-supported: true
softdepend:
  - BetterModel
  - EliteMobs
  - MythicMobs
  - WorldGuard
  - WorldEdit
  - Terralith
  - Iris
  - Terra
  - TerraformGenerator
authors: [ MagmaGuy ]
description: A plugin that adds random structures to your Minecraft world!
website: magmaguy.com
commands:
  betterstructures:
    description: Main command
    # Any existing child grant permits root access; each child still checks its own permission.
    permission: 'betterstructures.*;betterstructures.setup;betterstructures.initialize;betterstructures.generatemodules;betterstructures.warn;betterstructures.teleport'
    aliases:
      - bs
permissions:
  betterstructures.warn:
    description: Gives admins access to structure generation warnings and teleportation
    default: op
  betterstructures.teleport:
    description: Gives access to teleport to generated structures
    default: op
  betterstructures.setup:
    description: Gives admins access to the /betterstructures setup command
    default: op
  betterstructures.initialize:
    description: Gives admins access to the /betterstructures initialize command
    default: op
  betterstructures.generatemodules.slowly:
    description: Gives admins access to the /betterstructures generateModulesSlowly command
    default: op
  betterstructures.generatemodules.instantly:
    description: Gives admins access to the /betterstructures generateModulesInstantly command
    default: op
  betterstructures.generatemodules:
    description: Gives admins access to the /betterstructures generateModules command
    default: op
